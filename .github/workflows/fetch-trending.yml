name: Probe Bilibili International
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official creator ranking
        run: |
          python3 - <<'PY'
          import urllib.request,json
          for path in ['listV2', 'list']:
              url='https://api.bilibili.tv/intl/up/ranking/'+path
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://studio.bilibili.tv/','Origin':'https://studio.bilibili.tv','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read()
                      print('ENDPOINT',url,'HTTP',r.status)
                      try:
                          data=json.loads(body)
                          print(json.dumps(data,ensure_ascii=False)[:18000])
                      except ValueError:
                          print('Non-JSON response',body[:200].decode(errors='replace'))
              except Exception as e:
                  print(type(e).__name__,str(e))
          PY
